name: Safety regression QA
on:
  pull_request:
  push:
    branches: ['fix/data-integrity-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: safety-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install jinja2
      - name: Run regression checks when present
        run: |
          if [ -f scripts/test_safety.py ]; then python scripts/test_safety.py; fi
          if [ -f scripts/test_safety.mjs ]; then node scripts/test_safety.mjs; fi
      - run: python scripts/build.py --base / --origin https://dotreportcard.com --cname dotreportcard.com --api https://api.dotreportcard.com
      - name: Validate generated reports when present
        run: |
          if [ -f scripts/validate_site.py ]; then python scripts/validate_site.py; fi
      - name: Package exact source for reproducible review
        run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: safety-review-${{ github.sha }}
          path: |
            source.tar
            dist
          retention-days: 7
