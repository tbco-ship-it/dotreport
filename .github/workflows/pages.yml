name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch a new source snapshot before building
        type: boolean
        default: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
env:
  BASE: /
  ORIGIN: https://dotreportcard.com
  CNAME: dotreportcard.com
  API: https://api.dotreportcard.com
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install jinja2
      - name: Policy and normalization regression tests
        run: |
          python -m unittest discover -s tests -v
          node tests/test_worker.mjs
          node scripts/test_grade.mjs
      - name: Refresh source snapshot
        id: refresh
        if: github.event_name == 'schedule' || inputs.refresh == true
        continue-on-error: true
        run: |
          cp data/carriers.json /tmp/previous-carriers.json
          cp data/national.json /tmp/previous-national.json
          python scripts/collect.py
          python scripts/normalize.py
          python scripts/validate_data.py
          python -m unittest discover -s tests -v
          node scripts/test_grade.mjs
      - name: Retain last snapshot on refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          cp /tmp/previous-carriers.json data/carriers.json
          cp /tmp/previous-national.json data/national.json
          echo '## Refresh failed; previous snapshot retained without changing its data dates' >> "$GITHUB_STEP_SUMMARY"
      - name: Persist validated snapshot
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/carriers.json data/national.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh validated FMCSA source snapshot'
            git push origin HEAD:main
          fi
      - name: Build using canonical current policy
        run: python scripts/build.py --base "$BASE" --origin "$ORIGIN" --cname "$CNAME" --api "$API"
      - name: Validate every generated report before publication
        run: python scripts/validate_site.py
      - name: Record deployment provenance
        run: |
          python -c 'import json,os,pathlib,subprocess; pathlib.Path("dist/build-info.json").write_text(json.dumps({"source_commit":os.environ["GITHUB_SHA"],"data_commit":subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip(),"policy":"2.0.0","run_id":os.environ["GITHUB_RUN_ID"],"refresh_outcome":"${{ steps.refresh.outcome }}"}))'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
