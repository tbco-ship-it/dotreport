name: Apply reviewed trust patch
on:
  push:
    branches: ['fix/report-trust-20260918']
    paths: ['.github/workflows/apply-trust-patch.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install jinja2
      - name: Verify exact locally reviewed patch and apply to isolated branch
        run: |
          python - <<'PY'
          import hashlib, lzma, pathlib, subprocess
          parts = sorted(pathlib.Path('.trust-transfer').glob('part-*.xz'))
          assert len(parts) == 6
          patch = lzma.decompress(b''.join(p.read_bytes() for p in parts))
          expected = '4e606241fe2c630c80ad95719edb213371052976e8e3b91f169d9b5fa20a58e6'
          assert hashlib.sha256(patch).hexdigest() == expected
          assert b'diff --git a/.github/' not in patch
          pathlib.Path('/tmp/trust.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/trust.patch'],check=True)
          subprocess.run(['git','apply','--index','/tmp/trust.patch'],check=True)
          print('Verified reviewed patch SHA256:', expected)
          PY
          git rm -r .trust-transfer
      - name: Verify policy, normalization and complete report build
        run: |
          python -m unittest discover -s tests -v
          node tests/test_worker.mjs
          node scripts/test_grade.mjs
          python scripts/build.py --base / --origin https://dotreportcard.com --cname dotreportcard.com --api https://api.dotreportcard.com
      - name: Commit tested fixes without deploying production
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: correct carrier report evidence, scoring, authority and crash semantics' -m 'Policy 2.0.0; 19 regression tests, Worker fixtures and whole-snapshot invariants. See docs/TRUST-AUDIT-2026-09-18.md for sources, rationale and limits.'
          git push origin HEAD:fix/report-trust-20260918
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
          git archive --format=tar HEAD > /tmp/reviewed-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: /tmp/reviewed-source.tar
          retention-days: 7
