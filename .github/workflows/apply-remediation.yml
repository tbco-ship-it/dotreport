name: Apply reviewed safety remediation
on:
  push:
    branches: ['fix/data-integrity-2026-09-18']
    paths: ['.github/workflows/apply-remediation.yml']
permissions:
  contents: write
concurrency:
  group: apply-reviewed-safety-remediation
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'tbco-ship-it/dotreport' && github.ref == 'refs/heads/fix/data-integrity-2026-09-18'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify immutable reviewed patch and baseline
        run: |
          git merge-base --is-ancestor ee2878ba6166ab30cf33d96b85442c18a75d28d9 HEAD
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.delivery/patch-{i}.b64').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c3da244b2618bca43b3e6c052ab923c80fd30ebeff6c291fd937765d414b2e9f', 'Patch checksum mismatch'
          Path('/tmp/reviewed-remediation.patch').write_bytes(patch)
          PY
          git apply --index --check --unidiff-zero /tmp/reviewed-remediation.patch
          git apply --index --unidiff-zero /tmp/reviewed-remediation.patch
      - run: pip install jinja2
      - name: Regression and data validation
        run: |
          python scripts/test_safety.py
          node scripts/test_safety.mjs
          node scripts/test_grade.mjs
          python scripts/validate_data.py
          python scripts/build.py --base / --origin https://dotreportcard.com --cname dotreportcard.com --api https://api.dotreportcard.com
          python scripts/validate_site.py
          git diff --check
      - name: Commit only validated readable source and evidence
        run: |
          rm .delivery/patch-{1,2,3,4}.b64 .github/workflows/apply-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make safety screening evidence-based; add provenance, regression gates and rationale'
          git push origin HEAD:fix/data-integrity-2026-09-18
          git rev-parse HEAD | tee remediation-commit.txt
      - name: Package exact verified source and preview
        run: |
          git archive --format=tar HEAD | gzip > source.tar.gz
          tar -czf preview.tar.gz dist
      - uses: actions/upload-artifact@v4
        with:
          name: verified-safety-remediation
          path: |
            source.tar.gz
            preview.tar.gz
            remediation-commit.txt
          retention-days: 7
